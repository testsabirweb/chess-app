# Builds an installable Android APK when you publish a GitHub Release.
# Does NOT run on ordinary pushes — only on release publish or manual trigger.
#
# Cost: free on public repos (unlimited Actions minutes). Private repos get
# 2,000 Actions minutes/month on the free plan — a release build uses ~15–25 min.

name: Android Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional label for the uploaded APK filename"
        required: false
        default: "manual"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  GOCACHE: ${{ github.workspace }}/.cache/go-build
  EBITENMOBILE_VERSION: v2.9.9
  ANDROID_NDK_VERSION: 28.2.13676358
  ANDROID_API: android-36
  ANDROID_BUILD_TOOLS: 36.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android SDK / NDK
        uses: actions/cache@v4
        id: android-sdk
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ANDROID_NDK_VERSION }}
            ${{ env.ANDROID_SDK_ROOT }}/platforms/${{ env.ANDROID_API }}
            ${{ env.ANDROID_SDK_ROOT }}/build-tools/${{ env.ANDROID_BUILD_TOOLS }}
            ${{ env.ANDROID_SDK_ROOT }}/platform-tools
          key: android-sdk-${{ runner.os }}-ndk-${{ env.ANDROID_NDK_VERSION }}-api36-bt36

      - name: Install Android SDK packages
        if: steps.android-sdk.outputs.cache-hit != 'true'
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;${{ env.ANDROID_API }}" \
            "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" \
            "ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: ${{ env.GOCACHE }}
          key: go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-${{ runner.os }}-

      - name: Cache ebitenmobile
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/go-bin/ebitenmobile
          key: ebitenmobile-${{ runner.os }}-${{ env.EBITENMOBILE_VERSION }}

      - name: Install ebitenmobile
        run: |
          mkdir -p "${{ github.workspace }}/.cache/go-bin"
          if [ -f "${{ github.workspace }}/.cache/go-bin/ebitenmobile" ]; then
            install -m 755 "${{ github.workspace }}/.cache/go-bin/ebitenmobile" "$(go env GOPATH)/bin/ebitenmobile"
          else
            go install github.com/hajimehoshi/ebiten/v2/cmd/ebitenmobile@${{ env.EBITENMOBILE_VERSION }}
            install -m 755 "$(go env GOPATH)/bin/ebitenmobile" "${{ github.workspace }}/.cache/go-bin/ebitenmobile"
          fi

      - name: Run unit tests (pure packages)
        run: go test -race ./internal/chess ./internal/challenge ./internal/layout ./internal/anim

      - name: Typecheck rendering layer (no display/audio needed)
        run: GOOS=js GOARCH=wasm go build ./...

      - name: Bind native library (AAR)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ANDROID_NDK_VERSION }}
        run: make bind

      - name: Decode release keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/chessapp-release.jks"
            if [ ! -s "${{ runner.temp }}/chessapp-release.jks" ]; then
              echo "signed=false" >> "$GITHUB_OUTPUT"
              echo "::warning::KEYSTORE_BASE64 did not decode to a valid file — building debug APK instead."
              exit 0
            fi
            echo "KEYSTORE_FILE=${{ runner.temp }}/chessapp-release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets not configured — building debug APK instead."
          fi

      - name: Derive version from tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${{ inputs.tag }}"
          fi
          if [ -z "$tag" ] || [ "$tag" = "manual" ]; then
            echo "code=1" >> "$GITHUB_OUTPUT"
            echo "name=dev" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          v="${tag#v}"
          IFS=. read -r MA MI PA <<< "$v"
          MA=${MA:-0}
          MI=${MI:-0}
          PA=${PA:-0}
          echo "code=$(( MA * 10000 + MI * 100 + PA ))" >> "$GITHUB_OUTPUT"
          echo "name=$v" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        if: steps.signing.outputs.signed == 'true'
        run: make apk-release versionCode=${{ steps.ver.outputs.code }} versionName=${{ steps.ver.outputs.name }}

      - name: Build debug APK
        if: steps.signing.outputs.signed != 'true'
        run: make apk versionCode=${{ steps.ver.outputs.code }} versionName=${{ steps.ver.outputs.name }}

      - name: Verify 16 KB page alignment
        run: |
          export PATH="${ANDROID_SDK_ROOT}/ndk/${{ env.ANDROID_NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            make verify-16k APK=android/app/build/outputs/apk/release/app-release.apk
          else
            make verify-16k APK=android/app/build/outputs/apk/debug/app-debug.apk
          fi

      - name: Name APK artifact
        id: apk
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            name="toddler-chess-${{ github.event.release.tag_name }}.apk"
          else
            name="toddler-chess-${{ inputs.tag }}.apk"
          fi
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "$name"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "$name"
          fi
          echo "path=$name" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
